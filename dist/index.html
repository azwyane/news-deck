html[data-night="on"] :where(body,#readerPage,#settingsPage,#assistantPage,#wrappedPage,#sidebarPanel){background:var(--nd-night-bg)!important}
@media (prefers-color-scheme:dark){html[data-night="auto"] :where(body,#readerPage,#settingsPage,#assistantPage,#wrappedPage,#sidebarPanel){background:var(--nd-night-bg)!important}}
html[data-night="on"] :where(header,#tabsBar,#feed,footer,#readerPage>.reader-bar,#readerPage>.reader-article,.reader-popover,.settings-content,.assistant-bar,.assistant-body,.wrap-content,#sidebarPanel){filter:sepia(.3) hue-rotate(-20deg) brightness(.92) contrast(.95)!important}
@media (prefers-color-scheme:dark){html[data-night="auto"] :where(header,#tabsBar,#feed,footer,#readerPage>.reader-bar,#readerPage>.reader-article,.reader-popover,.settings-content,.assistant-bar,.assistant-body,.wrap-content,#sidebarPanel){filter:sepia(.15) hue-rotate(-10deg) brightness(.95)!important}}
@media screen{#readerPage{inset:0!important;width:100%!important;height:100dvh!important;max-height:none!important;transform:none!important}}
:root{--ui-font-size:14px;--ui-font-weight:400;--ui-line-height:1.5;--ui-icon-scale:1}
body,button,input,select,textarea{font-size:var(--ui-font-size)!important;font-weight:var(--ui-font-weight)!important;line-height:var(--ui-line-height)!important}
:where(body,button,input,select,textarea,a,p,span,div,li,label,td,th){font-weight:var(--ui-font-weight)!important}
:where(strong,b,h1,h2,h3,h4,.card a.title,.reader-article h1,.settings-section h3,.settings-title,.sidebar-title,.tool-copy strong){font-weight:700!important}
:where(body,button,input,select,textarea,.reader-body,.card,.settings-content,.modal,.reader-article){line-height:var(--ui-line-height)!important}
.card a.title{font-size:calc(var(--ui-font-size)*1.05)!important}
:where(.card .desc,.settings-desc,.settings-label,.stat-sources){font-size:calc(var(--ui-font-size)*.9)!important}
.reader-article h1{font-size:calc(var(--rfs)*1.4)!important}
.reader-body{font-size:var(--rfs)!important}
.settings-section h3{font-size:calc(var(--ui-font-size)*1.15)!important}
html[data-font="hand"] *{font-family:"Hand",-apple-system,system-ui,sans-serif!important}
:where(.icon-btn,.rm-icon,.starbtn,.mp-icon,.tool-ico,.tool-chev,.tab-icon,.flow-act-btn .ico,.empty-icon,.mute-icon,.delete-feed,.drag-handle,.spin){font-family:inherit!important;font-weight:400!important;line-height:1!important;font-variant-numeric:normal!important}
:where(.icon-btn,.rm-icon,.starbtn,.mp-icon,.tool-ico,.tool-chev,.tab-icon,.flow-act-btn .ico,.mute-icon,.delete-feed,.drag-handle){font-size:calc(1em*var(--ui-icon-scale))!important}
.empty-icon{font-size:calc(28px*var(--ui-icon-scale))!important}
.radio-cards .radio-card-icon{font-size:calc(20px*var(--ui-icon-scale))!important}
.radio-slide-icon{font-size:calc(52px*var(--ui-icon-scale))!important}
.radio-play-btn{font-size:calc(20px*var(--ui-icon-scale))!important}
.radio-flow-icon{font-size:calc(48px*var(--ui-icon-scale))!important}
:where(.hdr-icon,.tab-icon,.flow-action-btn svg){width:calc(1em*var(--ui-icon-scale))!important;height:calc(1em*var(--ui-icon-scale))!important;flex:none}
.settings-typography{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.settings-font-url{display:flex;gap:8px}
.settings-font-url input{flex:1;min-width:0}
.settings-subtitle{margin:14px 0 4px;font-size:calc(var(--ui-font-size)*1.05);font-weight:700;color:var(--text)}
.settings-value{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.settings-row input[type="range"]{width:140px;max-width:45%}
@media print{
  @page{margin:14mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body>#app{display:block!important}
  body>#app>*:not(#readerPage){display:none!important}
  #readerPage,#readerPage.on{position:static!important;inset:auto!important;width:auto!important;height:auto!important;max-height:none!important;overflow:visible!important;background:#fff!important;color:#000!important;display:block!important;z-index:auto!important}
  .reader-bar,.reader-meta2,.reader-foot,.conn-panel,.ann-panel,#selToolbar,#readProg,#notesSheet,#overflowSheet,#readerPanel,#readerPanelBackdrop,#notesBackdrop,#overflowBackdrop{display:none!important}
  .reader-article{max-width:none!important;padding:0!important;overflow:visible!important}
  html[data-night] :where(header,#tabsBar,#feed,footer,#readerPage>.reader-bar,#readerPage>.reader-article,.reader-popover,.settings-content,.assistant-bar,.assistant-body,.wrap-content,#sidebarPanel){filter:none!important}
  .reader-article h1{font-size:20pt!important;color:#000!important;line-height:1.2!important;break-after:avoid}
  .reader-body{font-size:12pt!important;line-height:1.55!important;color:#000!important;overflow:visible!important;max-height:none!important}
  .reader-body img,.reader-body pre,.reader-body blockquote{break-inside:avoid;page-break-inside:avoid}
  .reader-body a{color:#000!important;text-decoration:none!important}
}
